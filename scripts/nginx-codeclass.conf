# CodeClass Live Nginx 配置
# 複製到: /etc/nginx/sites-available/codeclass
# 然後執行: ln -s /etc/nginx/sites-available/codeclass /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # 替換為您的域名

    # 前端靜態文件
    root /var/www/codeclass-live/dist;
    index index.html;

    # 靜態文件緩存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由 (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超時設置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理 (即時通信)
    location /socket.io {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket 超時
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 日誌
    access_log /var/log/nginx/codeclass_access.log;
    error_log /var/log/nginx/codeclass_error.log;
}

# HTTPS 配置 (使用 certbot 自動生成)
# 運行: certbot --nginx -d your-domain.com

